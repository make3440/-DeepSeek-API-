<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区用药AI助手</title>
    <style>
        :root {
            --primary: #2E7D32;
            --primary-dark: #1B5E20;
            --primary-light: #E8F5E9;
            --accent: #00897B;
            --danger: #D32F2F;
            --warning: #F57C00;
            --bg: #F5F7FA;
            --surface: #FFFFFF;
            --text: #212121;
            --text-secondary: #757575;
            --border: #E0E0E0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 头部 */
        header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 24px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-text p {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* 免责声明 */
        .disclaimer {
            background: #FFF3E0;
            border-left: 4px solid var(--warning);
            padding: 12px 16px;
            margin: 20px 0;
            border-radius: 4px;
            font-size: 0.875rem;
            color: #E65100;
        }

        /* 主布局 */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 20px;
            margin-top: 20px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 聊天区域 */
        .chat-section {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            min-height: 500px;
        }

        .chat-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            background: #FAFAFA;
        }

        .chat-tab {
            flex: 1;
            padding: 14px 16px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 0.9375rem;
            color: var(--text-secondary);
            transition: all 0.2s;
            position: relative;
        }

        .chat-tab:hover {
            background: #F0F0F0;
        }

        .chat-tab.active {
            color: var(--primary);
            font-weight: 500;
        }

        .chat-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 20px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.bot .message-content {
            background: var(--primary-light);
            color: var(--text);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message-time {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 6px;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* 欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome-message h2 {
            color: var(--primary);
            margin-bottom: 12px;
        }

        .welcome-message p {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .quick-btn {
            padding: 10px 16px;
            border: 1px solid var(--primary);
            background: white;
            color: var(--primary);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.875rem;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: var(--primary-light);
        }

        /* 输入区域 */
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--border);
            background: #FAFAFA;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-radius: 24px;
            font-size: 1rem;
            resize: none;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: var(--primary);
        }

        .send-btn {
            width: 48px;
            height: 48px;
            border: none;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .send-btn:hover {
            background: var(--primary-dark);
            transform: scale(1.05);
        }

        .send-btn:disabled {
            background: #BDBDBD;
            cursor: not-allowed;
            transform: none;
        }

        /* 侧边栏 */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--surface);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .card-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-body {
            padding: 16px;
        }

        /* 患者信息表单 */
        .form-group {
            margin-bottom: 14px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-label {
            display: block;
            font-size: 0.8125rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9375rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.8125rem;
        }

        .checkbox-item input {
            accent-color: var(--primary);
        }

        /* 药物相互作用工具 */
        .drug-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .drug-tag {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8125rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .drug-tag .remove {
            cursor: pointer;
            opacity: 0.6;
        }

        .drug-tag .remove:hover {
            opacity: 1;
        }

        .drug-input-wrapper {
            display: flex;
            gap: 8px;
        }

        .drug-input {
            flex: 1;
        }

        .add-drug-btn {
            padding: 10px 16px;
            border: none;
            background: var(--accent);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
        }

        .check-btn {
            width: 100%;
            padding: 12px;
            border: none;
            background: var(--danger);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9375rem;
            font-weight: 500;
            margin-top: 12px;
        }

        .check-btn:hover {
            background: #B71C1C;
        }

        .check-btn:disabled {
            background: #BDBDBD;
            cursor: not-allowed;
        }

        /* 常见症状快捷 */
        .symptom-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .symptom-btn {
            padding: 8px 14px;
            border: 1px solid var(--border);
            background: white;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.8125rem;
            transition: all 0.2s;
        }

        .symptom-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 交互分析结果 */
        .interaction-result {
            margin-top: 16px;
            padding: 16px;
            background: #FFF8E1;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 0.9375rem;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }

            .header-text h1 {
                font-size: 1.25rem;
            }

            .chat-section {
                height: calc(100vh - 180px);
            }

            .message-content {
                max-width: 95%;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* API配置提示 */
        .api-notice {
            background: #E3F2FD;
            border: 1px solid #90CAF9;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 0.8125rem;
            color: #1565C0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">💊</div>
            <div class="header-text">
                <h1>社区用药AI助手</h1>
                <p>专业临床药学咨询 · 安全用药指导</p>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="disclaimer">
            ⚠️ <strong>免责声明</strong>：本助手仅提供健康教育和用药参考信息，不能替代执业医师或药师。如有紧急情况或症状持续，请立即就医。
        </div>

        <div class="api-notice" id="apiNotice" style="display: none;">
            🔧 当前使用演示模式（未配置API密钥）。请在部署时设置 DeepSeek API 密钥以启用完整功能。
        </div>

        <div class="main-layout">
            <!-- 聊天区域 -->
            <section class="chat-section">
                <div class="chat-tabs">
                    <button class="chat-tab active" data-tab="chat">💬 智能咨询</button>
                    <button class="chat-tab" data-tab="interaction">⚠️ 药物相互作用</button>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">🏥</div>
                        <h2>您好，我是社区用药助手</h2>
                        <p>我可以帮您分析用药问题、检查药物相互作用、提供安全用药建议</p>
                        <div class="quick-actions">
                            <button class="quick-btn" onclick="askQuestion('最近有点头痛，应该怎么办？')">🤕 头痛怎么办</button>
                            <button class="quick-btn" onclick="askQuestion('高血压患者日常用药有什么注意事项？')">💉 高血压用药注意</button>
                            <button class="quick-btn" onclick="askQuestion('哪些药物不能和华法林一起服用？')">💊 华法林配伍禁忌</button>
                            <button class="quick-btn" onclick="askQuestion('老年人服用多种药物需要注意什么？')">👴 老年人多重用药</button>
                        </div>
                    </div>
                </div>

                <!-- 咨询输入 -->
                <div class="chat-input-area" id="chatInputArea">
                    <div class="input-wrapper">
                        <textarea 
                            class="chat-input" 
                            id="chatInput" 
                            placeholder="请描述您的用药问题..."
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                        ></textarea>
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
                    </div>
                </div>

                <!-- 相互作用输入 -->
                <div class="chat-input-area" id="interactionInputArea" style="display: none;">
                    <div class="card-body">
                        <div class="form-group">
                            <label class="form-label">添加药物</label>
                            <div class="drug-input-wrapper">
                                <input type="text" class="form-input drug-input" id="drugInput" placeholder="输入药物名称，按回车添加">
                                <button class="add-drug-btn" onclick="addDrug()">+ 添加</button>
                            </div>
                        </div>
                        <div class="drug-list" id="drugList"></div>
                        <button class="check-btn" id="checkBtn" onclick="checkInteractions()" disabled>
                            🔍 检查药物相互作用
                        </button>
                        <div id="interactionResult"></div>
                    </div>
                </div>
            </section>

            <!-- 侧边栏 -->
            <aside class="sidebar">
                <!-- 患者信息 -->
                <div class="card">
                    <div class="card-header">
                        <span>👤</span> 患者信息
                    </div>
                    <div class="card-body">
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">年龄</label>
                                <input type="number" class="form-input" id="age" placeholder="岁">
                            </div>
                            <div class="form-group">
                                <label class="form-label">性别</label>
                                <select class="form-select" id="gender">
                                    <option value="">请选择</option>
                                    <option value="male">男</option>
                                    <option value="female">女</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">体重(kg)</label>
                                <input type="number" class="form-input" id="weight" step="0.1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">身高(cm)</label>
                                <input type="number" class="form-input" id="height">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">过敏史</label>
                            <input type="text" class="form-input" id="allergies" placeholder="如：青霉素、阿司匹林">
                        </div>
                        <div class="form-group">
                            <label class="form-label">既往病史</label>
                            <div class="checkbox-group">
                                <label class="checkbox-item"><input type="checkbox" value="高血压"> 高血压</label>
                                <label class="checkbox-item"><input type="checkbox" value="糖尿病"> 糖尿病</label>
                                <label class="checkbox-item"><input type="checkbox" value="心脏病"> 心脏病</label>
                                <label class="checkbox-item"><input type="checkbox" value="肝病"> 肝病</label>
                                <label class="checkbox-item"><input type="checkbox" value="肾病"> 肾病</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">当前用药</label>
                            <input type="text" class="form-input" id="currentMeds" placeholder="如：阿司匹林、二甲双胍">
                        </div>
                        <button class="check-btn" style="background: var(--primary); margin-top: 12px;" onclick="clearPatientInfo()">
                            🗑️ 清除信息
                        </button>
                    </div>
                </div>

                <!-- 常见症状 -->
                <div class="card">
                    <div class="card-header">
                        <span>🩺</span> 常见症状
                    </div>
                    <div class="card-body">
                        <div class="symptom-list">
                            <button class="symptom-btn" onclick="askQuestion('发烧38.5度怎么处理？')">🤒 发热</button>
                            <button class="symptom-btn" onclick="askQuestion('咳嗽有痰怎么办？')">😷 咳嗽</button>
                            <button class="symptom-btn" onclick="askQuestion('胃痛胃酸怎么处理？')">🤢 胃痛</button>
                            <button class="symptom-btn" onclick="askQuestion('便秘有什么好办法？')">😣 便秘</button>
                            <button class="symptom-btn" onclick="askQuestion('头痛应该吃什么药？')">😵 头痛</button>
                            <button class="symptom-btn" onclick="askQuestion('皮肤过敏怎么处理？')">🔴 过敏</button>
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </main>

    <script>
        // API配置
        const API_BASE = window.location.origin;

        // 状态
        let conversationHistory = [];
        let currentTab = 'chat';
        let drugs = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 检查API配置
            checkApiConfig();

            // 标签切换
            document.querySelectorAll('.chat-tab').forEach(tab => {
                tab.addEventListener('click', () => switchTab(tab.dataset.tab));
            });

            // 药物输入回车事件
            document.getElementById('drugInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    addDrug();
                }
            });
        });

        async function checkApiConfig() {
            try {
                const res = await fetch(`${API_BASE}/`);
                if (!res.ok) {
                    document.getElementById('apiNotice').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('apiNotice').style.display = 'block';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.chat-tab').forEach(t => {
                t.classList.toggle('active', t.dataset.tab === tab);
            });

            const chatArea = document.getElementById('chatInputArea');
            const interactionArea = document.getElementById('interactionInputArea');
            const welcome = document.getElementById('welcomeMessage');

            if (tab === 'chat') {
                chatArea.style.display = 'block';
                interactionArea.querySelector('.card-body').style.display = 'none';
                interactionArea.style.display = 'block';
                welcome.style.display = conversationHistory.length === 0 ? 'block' : 'none';
            } else {
                chatArea.style.display = 'none';
                interactionArea.style.display = 'block';
                interactionArea.querySelector('.card-body').style.display = 'block';
                welcome.style.display = 'none';
            }
        }

        function getPatientInfo() {
            const history = [];
            document.querySelectorAll('#medicalHistory input:checked').forEach(cb => {
                history.push(cb.value);
            });

            return {
                age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : null,
                gender: document.getElementById('gender').value || null,
                weight: document.getElementById('weight').value ? parseFloat(document.getElementById('weight').value) : null,
                height: document.getElementById('height').value ? parseFloat(document.getElementById('height').value) : null,
                allergies: document.getElementById('allergies').value || null,
                medical_history: history.length > 0 ? history : [],
                current_medications: document.getElementById('currentMeds').value ? 
                    document.getElementById('currentMeds').value.split(/[,，、]/).filter(s => s.trim()) : []
            };
        }

        function clearPatientInfo() {
            document.querySelectorAll('#age, #gender, #weight, #height, #allergies, #currentMeds').forEach(el => el.value = '');
            document.querySelectorAll('#medicalHistory input').forEach(cb => cb.checked = false);
        }

        function addMessage(content, isUser = false) {
            const container = document.getElementById('chatMessages');
            const welcome = document.getElementById('welcomeMessage');
            
            if (welcome) welcome.style.display = 'none';

            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            msgDiv.innerHTML = `
                <div class="message-content">${escapeHtml(content)}</div>
                <div class="message-time">${time}</div>
            `;
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML.replace(/\n/g, '<br>');
        }

        function showLoading() {
            const container = document.getElementById('chatMessages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = 'loading';
            loadingDiv.innerHTML = `
                <div class="message-content">
                    <div class="loading"><div class="spinner"></div></div>
                    正在分析中...
                </div>
            `;
            container.appendChild(loadingDiv);
            container.scrollTop = container.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loading');
            if (loading) loading.remove();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function autoResize(el) {
            el.style.height = 'auto';
            el.style.height = Math.min(el.scrollHeight, 120) + 'px';
        }

        function askQuestion(question) {
            document.getElementById('chatInput').value = question;
            sendMessage();
        }

        async function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;

            // 添加用户消息
            addMessage(message, true);
            conversationHistory.push({ role: 'user', content: message });
            input.value = '';
            autoResize(input);

            // 显示加载
            showLoading();

            try {
                const response = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        patient_info: getPatientInfo(),
                        conversation_history: conversationHistory.slice(-20)
                    })
                });

                if (!response.ok) throw new Error('请求失败');

                const data = await response.json();
                removeLoading();
                addMessage(data.response);
                conversationHistory.push({ role: 'assistant', content: data.response });

            } catch (error) {
                removeLoading();
                addMessage('抱歉，服务暂时不可用。请稍后重试。\n\n如果问题持续，请联系管理员。');
                console.error('Error:', error);
            }
        }

        // 药物相互作用相关
        function addDrug() {
            const input = document.getElementById('drugInput');
            const drug = input.value.trim();
            if (!drug || drugs.includes(drug)) {
                input.value = '';
                return;
            }
            drugs.push(drug);
            input.value = '';
            renderDrugs();
        }

        function removeDrug(index) {
            drugs.splice(index, 1);
            renderDrugs();
        }

        function renderDrugs() {
            const container = document.getElementById('drugList');
            const checkBtn = document.getElementById('checkBtn');
            
            container.innerHTML = drugs.map((drug, i) => `
                <span class="drug-tag">
                    ${escapeHtml(drug)}
                    <span class="remove" onclick="removeDrug(${i})">✕</span>
                </span>
            `).join('');

            checkBtn.disabled = drugs.length < 2;
        }

        async function checkInteractions() {
            if (drugs.length < 2) return;

            const resultDiv = document.getElementById('interactionResult');
            const checkBtn = document.getElementById('checkBtn');
            
            checkBtn.disabled = true;
            checkBtn.textContent = '⏳ 检查中...';
            resultDiv.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            try {
                const response = await fetch(`${API_BASE}/api/interaction-check`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        drugs: drugs,
                        patient_info: getPatientInfo()
                    })
                });

                if (!response.ok) throw new Error('请求失败');

                const data = await response.json();
                resultDiv.innerHTML = `<div class="interaction-result">${data.analysis}</div>`;

            } catch (error) {
                resultDiv.innerHTML = '<div class="interaction-result" style="color: var(--danger);">⚠️ 检查失败，请稍后重试</div>';
                console.error('Error:', error);
            } finally {
                checkBtn.disabled = false;
                checkBtn.textContent = '🔍 检查药物相互作用';
            }
        }
    </script>
</body>
</html>
